    <text x="150" y="27" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">Program</text>
    <text x="16" y="71" font-family="Consolas, Monaco, monospace" font-size="12.5" text-decoration="underline" fill="#1e293b">+ Main(args : string[]) : void</text>
  </g>

  
  
  

  
