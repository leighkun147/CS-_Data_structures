    <text x="16" y="97" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ this[index : int] : T { get; set; }</text>
    <text x="16" y="119" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ Add(item : T) : void</text>
  </g>

  
  
  
