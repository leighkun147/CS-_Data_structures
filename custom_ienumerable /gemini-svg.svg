<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" width="1120" height="790" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    
    <marker id="hollow-triangle" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <polygon points="1,1 13,7 1,13" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
    </marker>

    
    <marker id="open-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polyline points="2,1 11,6 2,11" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  
  <rect width="1120" height="790" fill="#f8fafc" />

  
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#e2e8f0" />
  </pattern>
  <rect width="1120" height="790" fill="url(#dots)" />

  
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a">CustomList — Custom Collection &amp; Enumeration UML Class Diagram</text>
  <text x="40" y="64" font-size="13" fill="#64748b">Architecture of ICustomGetEnumerable, ICustomEnumerator, ICustomList, and CustomList</text>

  
  <g transform="translate(740, 22)">
    <rect width="340" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <line x1="16" y1="18" x2="54" y2="18" stroke="#334155" stroke-width="1.6" marker-end="url(#hollow-triangle)" />
    <text x="62" y="22" font-size="11.5" fill="#334155">Extends (Interface Inheritance)</text>

    <line x1="16" y1="38" x2="54" y2="38" stroke="#334155" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#hollow-triangle)" />
    <text x="62" y="42" font-size="11.5" fill="#334155">Implements</text>

    <line x1="205" y1="28" x2="243" y2="28" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#open-arrow)" />
    <text x="251" y="32" font-size="11.5" fill="#334155">Uses / Creates</text>
  </g>

  
  
  
  <g transform="translate(80, 105)" filter="url(#shadow)">
    <rect width="330" height="104" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <path d="M0,8 a8,8 0 0,1 8,-8 h314 a8,8 0 0,1 8,8 v44 h-330 z" fill="#e0f2fe" />
    <line x1="0" y1="52" x2="330" y2="52" stroke="#0284c7" stroke-width="1.4" />
    <text x="165" y="21" text-anchor="middle" font-size="11.5" font-style="italic" fill="#0369a1">&lt;&gt;</text>
    <text x="165" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">ICustomGetEnumerable</text>
    <text x="16" y="78" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ GetCustomEnumerator() : ICustomEnumerator</text>
  </g>

  
  
  
  <g transform="translate(670, 95)" filter="url(#shadow)">
    <rect width="330" height="134" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <path d="M0,8 a8,8 0 0,1 8,-8 h314 a8,8 0 0,1 8,8 v44 h-330 z" fill="#e0f2fe" />
    <line x1="0" y1="52" x2="330" y2="52" stroke="#0284c7" stroke-width="1.4" />
    <text x="165" y="21" text-anchor="middle" font-size="11.5" font-style="italic" fill="#0369a1">&lt;&gt;</text>
    <text x="165" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">ICustomEnumerator</text>
    <text x="16" y="75" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ Current : T { get }</text>
    <text x="16" y="97" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ MoveNext() : bool</text>
    <text x="16" y="119" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ Reset() : void</text>
  </g>

  
  
  
  <g transform="translate(80, 270)" filter="url(#shadow)">
    <rect width="330" height="134" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <path d="M0,8 a8,8 0 0,1 8,-8 h314 a8,8 0 0,1 8,8 v44 h-330 z" fill="#e0f2fe" />
    <line x1="0" y1="52" x2="330" y2="52" stroke="#0284c7" stroke-width="1.4" />
    <text x="165" y="21" text-anchor="middle" font-size="11.5" font-style="italic" fill="#0369a1">&lt;&gt;</text>
    <text x="165" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">ICustomList</text>
