    <text x="16" y="63" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#334155">- _items : T[]</text>
    <text x="16" y="83" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#334155">- _count : int</text>
    <line x1="0" y1="95" x2="380" y2="95" stroke="#cbd5e1" stroke-width="1.2" />

    
    <text x="16" y="115" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ Count : int { get }</text>
    <text x="16" y="135" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ this[index : int] : T { get; set; }</text>
    <text x="16" y="155" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ CustomList()</text>
    <text x="16" y="175" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ CustomList(capacity : int)</text>
    <text x="16" y="195" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ CustomList(params initialItems : T[])</text>
    <text x="16" y="215" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ Add(item : T) : void</text>
    <text x="16" y="235" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#475569">- Resize() : void</text>
    <text x="16" y="254" font-family="Consolas, Monaco, monospace" font-size="12.5" font-weight="600" fill="#0369a1">+ GetCustomEnumerator() : ICustomEnumerator</text>
    <text x="16" y="270" font-family="Consolas, Monaco, monospace" font-size="12.5" font-weight="600" fill="#0369a1">+ GetEnumerator() : CustomEnumerator</text>
  </g>

  
  
  
  <g transform="translate(655, 315)" filter="url(#shadow)">
    <rect width="360" height="215" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <path d="M0,8 a8,8 0 0,1 8,-8 h344 a8,8 0 0,1 8,8 v34 h-360 z" fill="#f1f5f9" />
    <line x1="0" y1="42" x2="360" y2="42" stroke="#334155" stroke-width="1.4" />
    <text x="180" y="27" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">CustomEnumerator</text>

    
    <text x="16" y="63" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#334155">- _items : T[]</text>
    <text x="16" y="83" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#334155">- _count : int</text>
    <text x="16" y="103" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#334155">- _position : int = -1</text>
    <line x1="0" y1="115" x2="360" y2="115" stroke="#cbd5e1" stroke-width="1.2" />

    
    <text x="16" y="136" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ CustomEnumerator(items : T[], count : int)</text>
    <text x="16" y="158" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ Current : T { get }</text>
    <text x="16" y="180" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ MoveNext() : bool</text>
    <text x="16" y="202" font-family="Consolas, Monaco, monospace" font-size="12.5" fill="#1e293b">+ Reset() : void</text>
  </g>

  
  
  
  <g transform="translate(685, 625)" filter="url(#shadow)">
    <rect width="300" height="92" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <path d="M0,8 a8,8 0 0,1 8,-8 h284 a8,8 0 0,1 8,8 v34 h-300 z" fill="#f1f5f9" />
